gaps:
- 지표 저장소 없음 → '언제부터·얼마나' 추세, 큐 적체, 처리량을 볼 수 없다
- 로그 수집기 자체 상태(버퍼·재시도·heartbeat)를 볼 신호가 있는지 확인 필요 → '로그 없음'과 '수집 중단'을 구분하기 위해
- k8s 이벤트 보존이 짧음(22m) → 사후 분석 때 재시작·OOM·스케줄링 이력이 사라진다
- metrics API 없음 → 지금 CPU·메모리 사용량 조회 불가
- 트레이스 없음 → 서비스 간 어느 구간에서 느려지는지는 로그의 request_id 로만 추적
- 경보 시스템 없음 → 장애를 먼저 알려줄 신호가 없다
- '클러스터 밖 접근 주소 없음: rabbitmq → MCP 를 붙이려면 Ingress 등으로 열어야 한다 (읽기 전용 SA 는 port-forward 불가)'
