events:
  count: 129
  oldest_age: 37m
  ttl_source: kube-apiserver 기본값 (--event-ttl 없음)
  ttl: 1h
gaps:
- id: shipper-health
  detail: fluentd 자체 상태(버퍼·재시도·처리량)를 보는 신호 없음 → '로그 없음'과 '수집 중단'을 구분할 수 없다
- id: short-event-ttl
  detail: k8s 이벤트 보존 1h (kube-apiserver 기본값 (--event-ttl 없음)) → 사후 분석 때 재시작·OOM·스케줄링 이력이 사라진다
- id: no-metrics-api
  detail: metrics API(metrics-server) 없음 → kubectl top 불가
- id: no-traces
  detail: 트레이스 없음 → 서비스 간 어느 구간에서 느려지는지는 로그의 request_id 로만 추적
- id: no-access
  detail: '클러스터 밖 접근 주소 없음: alertmanager, rabbitmq'
- id: not-scraped
  detail: 'Prometheus 가 수집하지 않는 구성요소: argocd, fluentd, ingress-nginx, opensearch, rabbitmq, redis'
