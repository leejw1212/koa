# KOA 카탈로그 — "클러스터에서 무엇을 찾을지"와 "찾으면 어떤 MCP 를 붙일지".
#
# discover.py 는 components 규칙으로 클러스터의 구성요소를 찾는다.
# plan.py 는 클러스터 프로필 + mcp_servers 규칙으로 설치 계획을 만든다.
#
# status
#   verified  : 우리가 lab 에서 직접 붙여 보고 읽기 전용임을 확인했다. --apply 로 바로 등록된다.
#   candidate : README 로 읽기 전용 설정을 확인했지만 아직 붙여 보지 않았다.
#               --with <이름> 으로 명시해야만 등록된다.

# ─── 구성요소 감지 규칙 ───────────────────────────────────────────
# image : 컨테이너 이미지 이름(레지스트리·태그 제외)에 대한 정규식
# crd   : 이 API 그룹이 있으면 감지 근거로 쓴다
# ports : 서비스 포트 이름/번호 힌트 (감지 근거가 아니라 표시용)
# probe : 접근 주소를 알 때 GET 으로 확인할 경로 (읽기만 한다)
# metrics_hint : Prometheus 가 이 구성요소를 수집하지 않을 때 보고서에 낼 제안
# access_hint  : 클러스터 밖 접근 주소가 없을 때 보고서에 낼 제안
components:
  prometheus:
    kind: metrics
    image: '(^|/)prometheus/prometheus$|(^|/)prom/prometheus$'
    crd: monitoring.coreos.com
    ports: [9090]
    probe: /-/healthy
  alertmanager:
    kind: alerting
    image: '(^|/)prometheus/alertmanager$|(^|/)prom/alertmanager$'
    ports: [9093]
    probe: /-/healthy
    access_hint: 급하지 않다 — 지금 울리는 경보는 Prometheus 의 ALERTS 지표·/api/v1/alerts 로 볼 수 있다. silence·이력까지 보려면 Ingress(routePrefix /alertmanager)로 연다
  thanos:
    kind: metrics
    image: '(^|/)thanos(io)?/thanos$'
    ports: [10902, 9090]
  victoriametrics:
    kind: metrics
    image: '(^|/)victoriametrics/(victoria-metrics|vmselect|vmsingle)$'
    crd: operator.victoriametrics.com
    ports: [8428, 8481]
  kube-state-metrics:
    kind: metrics-exporter
    image: 'kube-state-metrics$'
  node-exporter:
    kind: metrics-exporter
    image: 'node-exporter$'
  grafana:
    kind: dashboard
    image: '(^|/)grafana/grafana(-oss|-enterprise)?$'
    ports: [3000]
    probe: /api/health
  loki:
    kind: logs
    image: '(^|/)grafana/loki$'
    ports: [3100]
    probe: /ready
  opensearch:
    kind: logs
    image: '(^|/)opensearchproject/opensearch$'
    crd: opensearch.opster.io
    ports: [9200]
    probe: /
    metrics_hint: prometheus-community/elasticsearch-exporter(OpenSearch 호환) 를 띄우고 ServiceMonitor 로 수집 — 클러스터 상태·디스크·쓰기 거절(rejected) 지표
  elasticsearch:
    kind: logs
    image: '(^|/)elasticsearch(/elasticsearch)?$'
    crd: elasticsearch.k8s.elastic.co
    ports: [9200]
    probe: /
  fluentd:
    kind: log-shipper
    image: 'fluentd'
    crd: logging.banzaicloud.io
    metrics_hint: 'fluent-plugin-prometheus(이미지에 보통 포함)로 <source> @type prometheus(24231) + prometheus_monitor + prometheus_output_monitor 를 켜고 ServiceMonitor 추가 — 버퍼 길이·재시도·출력 오류'
  fluent-bit:
    kind: log-shipper
    image: 'fluent-bit$'
    metrics_hint: 내장 HTTP 서버(2020, /api/v2/metrics/prometheus)를 켜고 ServiceMonitor 추가
  vector:
    kind: log-shipper
    image: '(^|/)timberio/vector$|(^|/)vector$'
  otel-collector:
    kind: telemetry-collector
    image: 'opentelemetry-collector'
    crd: opentelemetry.io
  tempo:
    kind: traces
    image: '(^|/)grafana/tempo$'
  jaeger:
    kind: traces
    image: 'jaeger'
    crd: jaegertracing.io
  argocd:
    kind: gitops
    image: '(^|/)argoproj/argocd$'
    crd: argoproj.io
    probe: /healthz
    metrics_hint: argocd-metrics(8082)·argocd-server-metrics(8083)·argocd-repo-server(8084) 서비스가 이미 있다 → ServiceMonitor 만 추가 (Helm 이면 *.metrics.serviceMonitor.enabled=true) — 동기화 실패·앱 헬스
  flux:
    kind: gitops
    image: '(^|/)fluxcd/(source|kustomize|helm)-controller$'
    crd: toolkit.fluxcd.io
  rabbitmq:
    kind: message-queue
    image: '(^|/)rabbitmq$|bitnami/rabbitmq$'
    crd: rabbitmq.com
    ports: [5672, 15672, 15692]
    probe: /api/overview
    metrics_hint: 'rabbitmq_prometheus 플러그인(15692)을 서비스 포트로 열고 ServiceMonitor 추가 — 큐 길이·소비자 수·unacked. 큐별 값은 /metrics/per-object 또는 /metrics/detailed. 공식 이미지는 플러그인이 기본으로 켜져 있는지 확인 필요'
    access_hint: 관리 API(15672)를 Ingress + 인증으로 열고 monitoring 태그 전용 사용자를 만든다. 큐 상태만 필요하면 15692 지표를 Prometheus 로 보는 것으로 충분하다
  kafka:
    kind: message-queue
    image: 'kafka'
    crd: kafka.strimzi.io
    ports: [9092]
  redis:
    kind: cache
    image: '(^|/)redis$|bitnami/redis$|valkey'
    ports: [6379]
    metrics_hint: oliver006/redis_exporter(9121) 사이드카 + ServiceMonitor — 메모리·연결 수·eviction
  ingress-nginx:
    kind: ingress
    image: 'ingress-nginx/controller'
    metrics_hint: 'Helm controller.metrics.enabled=true + controller.metrics.serviceMonitor.enabled=true (10254) — 경로별 요청 수·5xx·지연. 장애 영향 범위를 가장 먼저 보여주는 지표'
  metrics-server:
    kind: metrics-api
    image: 'metrics-server$'

# ─── MCP 서버 규칙 ───────────────────────────────────────────────
# when       : 이 조건이 프로필에 있으면 붙일 후보가 된다
#              (k8s_read = k8s 조회 권한 있음 / component:<이름> = 그 구성요소 감지됨)
# requires_env: ~/.hermes/.env 에 값이 있어야 하는 변수. 없으면 등록하지 않고 안내만 한다.
# url_env    : 접근 주소 변수. 프로필에서 찾은 주소를 제안값으로 보여준다.
# server     : Hermes config.yaml 의 mcp_servers.<이름> 에 그대로 들어갈 값
mcp_servers:
  kubernetes:
    status: verified
    when: k8s_read
    note: 읽기 전용 SA kubeconfig + 비파괴 도구 모드 + 조회 도구 4개만
    server:
      command: npx
      args: [-y, mcp-server-kubernetes@4.1.9]
      env:
        ALLOW_ONLY_NON_DESTRUCTIVE_TOOLS: "true"
        KUBECONFIG_PATH: ${userHome}/.kube/hermes-readonly.yaml
      tools:
        include: [kubectl_get, kubectl_describe, kubectl_logs, explain_resource]
        prompts: false
        resources: false

  opensearch:
    status: verified
    when: component:opensearch
    requires_env: [OPENSEARCH_URL, OPENSEARCH_USERNAME, OPENSEARCH_PASSWORD]
    url_env: OPENSEARCH_URL
    note: 쓰기 설정 끔 + 조회 도구 5개만. 계정은 OpenSearch 쪽 읽기 전용 역할이어야 한다
    server:
      command: uvx
      args: [opensearch-mcp-server-py@0.11.0]
      env:
        OPENSEARCH_URL: ${OPENSEARCH_URL}
        OPENSEARCH_SETTINGS_ALLOW_WRITE: "false"
        OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME}
        OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      tools:
        include: [ListIndexTool, IndexMappingTool, SearchIndexTool, GetShardsTool, ClusterHealthTool]
        prompts: false
        resources: false

  prometheus:
    status: candidate
    when: component:prometheus
    requires_env: [PROMETHEUS_URL]
    url_env: PROMETHEUS_URL
    note: PromQL 은 쓰기를 표현할 수 없어 도구 자체가 읽기 전용. 인증이 있으면 PROMETHEUS_USERNAME/PASSWORD 또는 PROMETHEUS_TOKEN 추가
    server:
      command: uvx
      args: [prometheus-mcp-server@1.6.2]
      env:
        PROMETHEUS_URL: ${PROMETHEUS_URL}
        PROMETHEUS_DISABLE_LINKS: "True"
      tools:
        include: [execute_query, execute_range_query, list_metrics, get_metric_metadata, get_targets]
        prompts: false
        resources: false

  grafana:
    status: candidate
    when: component:grafana
    requires_env: [GRAFANA_URL, GRAFANA_SERVICE_ACCOUNT_TOKEN]
    url_env: GRAFANA_URL
    note: --disable-write 로 쓰기 도구 미등록. 서비스 계정은 Viewer 역할. Prometheus·Loki 를 Grafana 데이터소스로 함께 조회할 수 있다
    server:
      command: uvx
      args: [mcp-grafana@2.0.0, --disable-write]
      env:
        GRAFANA_URL: ${GRAFANA_URL}
        GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN}
      tools:
        prompts: false
        resources: false

  argocd:
    status: candidate
    when: component:argocd
    requires_env: [ARGOCD_BASE_URL, ARGOCD_API_TOKEN]
    url_env: ARGOCD_BASE_URL
    note: MCP_READ_ONLY + 조회 도구만. 토큰은 읽기 전용 role(get/list) 계정으로 발급
    server:
      command: npx
      args: [-y, argocd-mcp@0.9.0, stdio]
      env:
        ARGOCD_BASE_URL: ${ARGOCD_BASE_URL}
        ARGOCD_API_TOKEN: ${ARGOCD_API_TOKEN}
        MCP_READ_ONLY: "true"
      tools:
        include: [list_applications, get_application, get_application_resource_tree, get_application_managed_resources, get_resource_events]
        prompts: false
        resources: false

  rabbitmq:
    status: candidate
    when: component:rabbitmq
    requires_env: [RABBITMQ_MANAGEMENT_ENDPOINT]
    url_env: RABBITMQ_MANAGEMENT_ENDPOINT
    note: >-
      --allow-mutative-tools 없이 실행해 쓰기 도구 미등록, read/observability/health 그룹만.
      계정은 monitoring 태그 사용자. 주의: 이 서버는 SSRF 방지로 localhost·사설 IP 접속을 막는다
      (kind 처럼 localhost 로만 열린 클러스터는 접속 불가).
      값 형식 https://user:pass@host:443 — 비밀번호가 URL 에 들어가므로 .env 에만 둔다
    server:
      command: uvx
      args: [amq-mcp-server-rabbitmq@4.0.0, --v4, --tool-groups, read, observability, health]
      env:
        RABBITMQ_MANAGEMENT_ENDPOINT: ${RABBITMQ_MANAGEMENT_ENDPOINT}
      tools:
        prompts: false
        resources: false

# MCP 가 아직 없거나 다른 경로로 보는 구성요소 (plan.py 가 안내만 한다)
no_adapter:
  loki: Grafana MCP 의 Loki 데이터소스로 조회 (grafana 후보 참고)
  elasticsearch: '@elastic/mcp-server-elasticsearch 가 있지만 아직 카탈로그에 없음 (검증 필요)'
  fluentd: 전용 MCP 없음. prometheus 플러그인 지표 → Prometheus 로 보는 것이 정석
  fluent-bit: 전용 MCP 없음. 내장 HTTP 지표(2020 포트) → Prometheus
  kafka: 카탈로그에 없음 (검증 필요)
  redis: 카탈로그에 없음 (장애 분석용으로는 지표가 우선)
  thanos: Prometheus 호환 API → prometheus 후보의 PROMETHEUS_URL 로 Thanos Query 주소를 쓴다
  victoriametrics: Prometheus 호환 API → prometheus 후보의 PROMETHEUS_URL 로 vmselect 주소를 쓴다

# ─── 빈 곳 → 제안 ───────────────────────────────────────────────
# discover.py 가 찾은 빈 곳(gaps[].id)을 report.py 가 이 규칙으로 제안으로 바꾼다.
# priority 1 = 원인 분석이 막히는 것, 2 = 느려지거나 추정에 기대는 것, 3 = 있으면 좋은 것
# owner koa = 우리가 할 수 있는 것 / cluster = 클러스터 운영팀이 해야 하는 것
gap_advice:
  no-metrics:
    priority: 1
    owner: cluster
    title: 지표 저장소 구축
    impact: 언제부터·얼마나를 알 수 없어 장애 시작 시점과 추세를 로그로만 추정한다
    steps:
      - kube-prometheus-stack(Prometheus + kube-state-metrics + node-exporter + Alertmanager) 설치
      - 보존 14일 이상 — 지난주 같은 시간대와 비교해야 평소와 다른지 판단할 수 있다
      - 설치 후 KOA 가 prometheus MCP 를 붙인다
  no-logs:
    priority: 1
    owner: cluster
    title: 로그 저장소 구축
    impact: 재시작 전·삭제된 파드의 로그가 사라져 사후 분석이 불가능하다
    steps:
      - OpenSearch/Elasticsearch 또는 Loki 와 수집기(fluent-bit, fluentd, vector) 구성
  no-shipper:
    priority: 2
    owner: cluster
    title: 로그 수집 경로 확인
    impact: 어떤 로그가 어디서 들어오는지 몰라 로그가 없다는 사실을 해석할 수 없다
    steps:
      - 수집기가 클러스터 밖(호스트 에이전트, SaaS)에 있는지 확인하고 카탈로그에 감지 규칙을 추가
  shipper-health:
    priority: 1
    owner: cluster
    title: 로그 수집기 자체 상태 감시
    impact: 로그가 안 보일 때 트래픽이 없는 건지 수집이 끊긴 건지 구분할 수 없다 (kind-lab 에서 실제로 겪음)
    steps:
      - 수집기 지표(버퍼 길이, 재시도, 출력 오류, 처리량)를 Prometheus 로 수집 — 구성요소별 방법은 아래 '수집하지 않는 구성요소' 참고
      - 노드마다 1분에 한 번 heartbeat 레코드를 로그 저장소로 보내 마지막 수신 시각을 바로 볼 수 있게 한다
      - 수신이 N분 끊기면 울리는 경보
  short-event-ttl:
    priority: 1
    owner: cluster
    title: k8s 이벤트 장기 보관
    impact: 장애 뒤 분석을 시작하면 재시작·OOM·스케줄링 실패 이력이 이미 사라져 있다
    steps:
      - kubernetes-event-exporter 로 이벤트를 로그 저장소(OpenSearch 등)에 보낸다 — --event-ttl 을 늘리는 것보다 etcd 부담이 없다
      - 그 전까지 KOA 는 분석 첫 단계에서 이벤트부터 읽는다 (1시간 안에 사라짐)
  event-ttl-unknown:
    priority: 2
    owner: cluster
    title: k8s 이벤트 보존 기간 확인
    impact: 관리형 클러스터는 보통 1시간 — 사후 분석 때 이벤트가 없을 가능성이 높다
    steps:
      - 운영팀에 보존 기간을 확인하고, 짧으면 kubernetes-event-exporter 로 장기 보관
  no-gitops:
    priority: 3
    owner: cluster
    title: 변경 이력 확보
    impact: 무엇이 바뀌었나를 ReplicaSet revision 과 생성 시각으로만 복원한다
    steps:
      - GitOps(Argo CD/Flux) 도입, 또는 배포 파이프라인이 배포 이벤트를 로그 저장소에 남기게 한다
  no-metrics-api:
    priority: 3
    owner: cluster
    title: metrics-server 설치
    impact: kubectl top 과 HPA 를 쓸 수 없다. Prometheus 가 있으면 CPU·메모리는 cAdvisor 지표로 대신 본다
    steps:
      - metrics-server 설치 (HPA 를 쓰려면 필수)
  no-traces:
    priority: 3
    owner: cluster
    title: 분산 트레이스
    impact: 서비스 간 어느 구간에서 느려지는지 로그의 request_id 를 이어 붙여 추정한다
    steps:
      - OpenTelemetry SDK + collector + Tempo/Jaeger. ingress 에서 request_id 를 이미 넘기고 있다면 trace_id 로 확장
  no-alerting:
    priority: 2
    owner: cluster
    title: 경보 체계
    impact: 장애를 사람이 먼저 알아채야 분석이 시작된다
    steps:
      - Alertmanager + 기본 규칙(kube-prometheus-stack 기본 규칙만으로도 충분히 시작 가능)
      - 나중에 경보 → KOA 자동 1차 분석으로 연결
  no-access:
    priority: 2
    owner: cluster
    title: 관측 시스템 접근 경로
    impact: 클러스터 안에는 있지만 KOA(MCP)가 닿지 못해 그 데이터를 분석에 쓸 수 없다. 읽기 전용 SA 는 port-forward 도 막혀 있다
    steps:
      - Ingress 로 열되 반드시 인증(Basic Auth/OIDC)과 읽기 전용 계정을 붙인다. 또는 MCP 서버를 클러스터 안에서 띄운다
  not-scraped:
    priority: 2
    owner: cluster
    title: 지표를 수집하지 않는 구성요소
    impact: 이 구성요소들은 문제가 생겨도 로그로만 보인다 — 큐 적체, 버퍼 증가처럼 서서히 나빠지는 장애를 놓친다
    steps: []
