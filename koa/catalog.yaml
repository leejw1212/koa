# KOA 카탈로그 — "클러스터에서 무엇을 찾을지"와 "찾으면 어떤 MCP 를 붙일지".
#
# discover.py 는 components 규칙으로 클러스터의 구성요소를 찾는다.
# plan.py 는 클러스터 프로필 + mcp_servers 규칙으로 설치 계획을 만든다.
#
# status
#   verified  : 우리가 lab 에서 직접 붙여 보고 읽기 전용임을 확인했다. --apply 로 바로 등록된다.
#   candidate : README 로 읽기 전용 설정을 확인했지만 아직 붙여 보지 않았다.
#               --with <이름> 으로 명시해야만 등록된다.

# ─── 구성요소 감지 규칙 ───────────────────────────────────────────
# image : 컨테이너 이미지 이름(레지스트리·태그 제외)에 대한 정규식
# crd   : 이 API 그룹이 있으면 감지 근거로 쓴다
# ports : 서비스 포트 이름/번호 힌트 (감지 근거가 아니라 표시용)
# probe : 접근 주소를 알 때 GET 으로 확인할 경로 (읽기만 한다)
# fallback : 지표가 없거나 MCP 로 닿지 않을 때, 지금 쓸 수 있는 도구로 이 구성요소를 보는 방법
components:
  prometheus:
    kind: metrics
    image: '(^|/)prometheus/prometheus$|(^|/)prom/prometheus$'
    crd: monitoring.coreos.com
    ports: [9090]
    probe: /-/healthy
  alertmanager:
    kind: alerting
    fallback: 지금 울리는 경보는 prometheus MCP 로 ALERTS 지표를 조회해 본다
    image: '(^|/)prometheus/alertmanager$|(^|/)prom/alertmanager$'
    ports: [9093]
    probe: /-/healthy
  thanos:
    kind: metrics
    image: '(^|/)thanos(io)?/thanos$'
    ports: [10902, 9090]
  victoriametrics:
    kind: metrics
    image: '(^|/)victoriametrics/(victoria-metrics|vmselect|vmsingle)$'
    crd: operator.victoriametrics.com
    ports: [8428, 8481]
  kube-state-metrics:
    kind: metrics-exporter
    image: 'kube-state-metrics$'
  node-exporter:
    kind: metrics-exporter
    image: 'node-exporter$'
  grafana:
    kind: dashboard
    image: '(^|/)grafana/grafana(-oss|-enterprise)?$'
    ports: [3000]
    probe: /api/health
  loki:
    kind: logs
    fallback: grafana MCP 의 Loki 데이터소스로 조회한다
    image: '(^|/)grafana/loki$'
    ports: [3100]
    probe: /ready
  opensearch:
    kind: logs
    fallback: opensearch MCP 의 ClusterHealthTool·GetShardsTool 로 클러스터 상태·샤드를 직접 본다. 쓰기 거절·디스크 경고는 파드 로그(kubectl_logs)
    image: '(^|/)opensearchproject/opensearch$'
    crd: opensearch.opster.io
    ports: [9200]
    probe: /
  elasticsearch:
    kind: logs
    image: '(^|/)elasticsearch(/elasticsearch)?$'
    crd: elasticsearch.k8s.elastic.co
    ports: [9200]
    probe: /
  fluentd:
    kind: log-shipper
    fallback: 파드 로그(kubectl_logs)에서 flush 실패·retry·연결 오류를 보고, 원본 파드 로그와 로그 저장소 마지막 문서 시각을 비교한다
    image: 'fluentd'
    crd: logging.banzaicloud.io
  fluent-bit:
    kind: log-shipper
    fallback: 파드 로그(kubectl_logs)에서 retry·오류를 보고, 원본 파드 로그와 로그 저장소 마지막 문서 시각을 비교한다
    image: 'fluent-bit$'
  vector:
    kind: log-shipper
    image: '(^|/)timberio/vector$|(^|/)vector$'
  otel-collector:
    kind: telemetry-collector
    image: 'opentelemetry-collector'
    crd: opentelemetry.io
  tempo:
    kind: traces
    image: '(^|/)grafana/tempo$'
  jaeger:
    kind: traces
    image: 'jaeger'
    crd: jaegertracing.io
  argocd:
    kind: gitops
    fallback: argocd MCP 로 동기화·헬스·diff·이력을 본다 (읽기 전용 SA 는 Application 리소스 조회 권한이 없어 kubernetes MCP 로는 안 보인다)
    image: '(^|/)argoproj/argocd$'
    crd: argoproj.io
    probe: /healthz
  flux:
    kind: gitops
    image: '(^|/)fluxcd/(source|kustomize|helm)-controller$'
    crd: toolkit.fluxcd.io
  rabbitmq:
    kind: message-queue
    fallback: 파드 로그(메모리·디스크 경보, 연결 끊김)와 소비자 앱 로그(재연결·처리 지연)로 본다. 큐 길이·소비자 수는 지금 범위에서 볼 수 없다
    image: '(^|/)rabbitmq$|bitnami/rabbitmq$'
    crd: rabbitmq.com
    ports: [5672, 15672, 15692]
    probe: /api/overview
  kafka:
    kind: message-queue
    fallback: 브로커 파드 로그와 소비자 앱 로그로 본다
    image: 'kafka'
    crd: kafka.strimzi.io
    ports: [9092]
  redis:
    kind: cache
    fallback: 파드 로그와 앱 로그의 연결 오류·타임아웃으로 본다
    image: '(^|/)redis$|bitnami/redis$|valkey'
    ports: [6379]
  ingress-nginx:
    kind: ingress
    fallback: 접근 로그가 로그 저장소에 있으면 경로별 status·request_time 을 집계한다. 없으면 컨트롤러 파드 로그(kubectl_logs)
    image: 'ingress-nginx/controller'
  metrics-server:
    kind: metrics-api
    image: 'metrics-server$'

# ─── MCP 서버 규칙 ───────────────────────────────────────────────
# when       : 이 조건이 프로필에 있으면 붙일 후보가 된다
#              (k8s_read = k8s 조회 권한 있음 / component:<이름> = 그 구성요소 감지됨)
# requires_env: ~/.hermes/.env 에 값이 있어야 하는 변수. 없으면 등록하지 않고 안내만 한다.
# url_env    : 접근 주소 변수. 프로필에서 찾은 주소를 제안값으로 보여준다.
# server     : Hermes config.yaml 의 mcp_servers.<이름> 에 그대로 들어갈 값
mcp_servers:
  kubernetes:
    status: verified
    when: k8s_read
    note: 읽기 전용 SA kubeconfig + 비파괴 도구 모드 + 조회 도구 4개만
    server:
      command: npx
      args: [-y, mcp-server-kubernetes@4.1.9]
      env:
        ALLOW_ONLY_NON_DESTRUCTIVE_TOOLS: "true"
        KUBECONFIG_PATH: ${userHome}/.kube/hermes-readonly.yaml
      tools:
        include: [kubectl_get, kubectl_describe, kubectl_logs, explain_resource]
        prompts: false
        resources: false

  opensearch:
    status: verified
    when: component:opensearch
    requires_env: [OPENSEARCH_URL, OPENSEARCH_USERNAME, OPENSEARCH_PASSWORD]
    url_env: OPENSEARCH_URL
    note: 쓰기 설정 끔 + 조회 도구 5개만. 계정은 OpenSearch 쪽 읽기 전용 역할이어야 한다
    server:
      command: uvx
      args: [opensearch-mcp-server-py@0.11.0]
      env:
        OPENSEARCH_URL: ${OPENSEARCH_URL}
        OPENSEARCH_SETTINGS_ALLOW_WRITE: "false"
        OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME}
        OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
      tools:
        include: [ListIndexTool, IndexMappingTool, SearchIndexTool, GetShardsTool, ClusterHealthTool]
        prompts: false
        resources: false

  prometheus:
    status: verified   # 2026-10-05 kind-lab: 도구 6개 중 5개 노출(health_check 제외), execute_query 실제 조회 확인, admin API 는 서버에서 꺼져 있음
    when: component:prometheus
    requires_env: [PROMETHEUS_URL]
    url_env: PROMETHEUS_URL
    note: PromQL 은 쓰기를 표현할 수 없어 도구 자체가 읽기 전용. 인증이 있으면 PROMETHEUS_USERNAME/PASSWORD 또는 PROMETHEUS_TOKEN 추가
    server:
      command: uvx
      args: [prometheus-mcp-server@1.6.2]
      env:
        PROMETHEUS_URL: ${PROMETHEUS_URL}
        PROMETHEUS_DISABLE_LINKS: "True"
      tools:
        include: [execute_query, execute_range_query, list_metrics, get_metric_metadata, get_targets]
        prompts: false
        resources: false

  grafana:
    status: verified   # 2026-10-05 kind-lab: --disable-write 에서도 도구 62개 → 분석용 조회 도구만 include. Viewer 토큰으로 대시보드·폴더 생성 403 확인
    when: component:grafana
    requires_env: [GRAFANA_URL, GRAFANA_SERVICE_ACCOUNT_TOKEN]
    url_env: GRAFANA_URL
    note: --disable-write + Viewer 서비스 계정 + 조회 도구만. Grafana 데이터소스(Prometheus·Loki·Tempo)를 한곳에서 조회
    server:
      command: uvx
      args: [mcp-grafana@2.0.0, --disable-write]
      env:
        GRAFANA_URL: ${GRAFANA_URL}
        GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN}
      tools:
        # 제외: alerting_manage_routing(이름상 관리 도구), grafana_api_request(GET 전용이지만 API 전체에 열림),
        #       oncall·incident·pyroscope·tempo·provisioning·docs 등 이 분석 범위 밖 도구
        include: [list_datasources, get_datasource, check_datasources_health,
                  search_dashboards, get_dashboard_summary, get_dashboard_panel_queries, get_dashboard_property,
                  query_prometheus, query_prometheus_histogram, list_prometheus_metric_names, list_prometheus_metric_metadata,
                  list_prometheus_label_names, list_prometheus_label_values,
                  query_loki_logs, query_loki_stats, query_loki_patterns, list_loki_label_names, list_loki_label_values,
                  list_alert_groups, get_alert_group, alerting_rules_read, get_annotations]
        prompts: false
        resources: false

  argocd:
    status: verified   # 2026-10-05 kind-lab: 하위 경로(/argocd) URL 로 앱 3개 조회, sync 는 MCP 가 'read-only mode' 로 거부, 토큰은 role:readonly(can-i sync/delete no). 도구 15 → 9
    when: component:argocd
    requires_env: [ARGOCD_BASE_URL, ARGOCD_API_TOKEN]
    url_env: ARGOCD_BASE_URL
    note: MCP_READ_ONLY(기본 true) + 조회 도구만. 토큰은 읽기 전용 role(role:readonly) 계정으로 발급
    # 처음 고른 argocd-mcp(argoproj-labs) 0.9.0 은 base URL 경로를 버려 하위 경로(/argocd)에서 못 쓴다 → 교체.
    # peopleforrester/mcp-k8s-observability-argocd-server: PyPI 미배포라 git 커밋으로 고정.
    #   base_url=f"{url}/api/v1" 로 경로 유지. 쓰기 도구는 등록되지만 MCP_READ_ONLY=true 면 실행 시 거부 → include 로 아예 숨긴다.
    server:
      command: uvx
      args: [--from, "git+https://github.com/peopleforrester/mcp-k8s-observability-argocd-server@6ba6d1b0c9f4b715de1feda49e247d2ccd8378e8", argocd-mcp]
      env:
        ARGOCD_URL: ${ARGOCD_BASE_URL}
        ARGOCD_TOKEN: ${ARGOCD_API_TOKEN}
        MCP_READ_ONLY: "true"
        MCP_DISABLE_DESTRUCTIVE: "true"
        MCP_MASK_SECRETS: "true"
      tools:
        include: [list_applications, get_application, get_application_status, get_application_diff,
                  get_application_history, diagnose_sync_failure, get_application_logs, list_clusters, list_projects]
        prompts: false
        resources: false

  rabbitmq:
    status: candidate
    when: component:rabbitmq
    requires_env: [RABBITMQ_MANAGEMENT_ENDPOINT]
    url_env: RABBITMQ_MANAGEMENT_ENDPOINT
    note: >-
      --allow-mutative-tools 없이 실행해 쓰기 도구 미등록, read/observability/health 그룹만.
      계정은 monitoring 태그 사용자. 주의: 이 서버는 SSRF 방지로 localhost·사설 IP 접속을 막는다
      (kind 처럼 localhost 로만 열린 클러스터는 접속 불가).
      값 형식 https://user:pass@host:443 — 비밀번호가 URL 에 들어가므로 .env 에만 둔다
    server:
      command: uvx
      args: [amq-mcp-server-rabbitmq@4.0.0, --v4, --tool-groups, read, observability, health]
      env:
        RABBITMQ_MANAGEMENT_ENDPOINT: ${RABBITMQ_MANAGEMENT_ENDPOINT}
      tools:
        prompts: false
        resources: false

# MCP 가 아직 없거나 다른 경로로 보는 구성요소 (plan.py 가 안내만 한다)
no_adapter:
  loki: Grafana MCP 의 Loki 데이터소스로 조회 (grafana 후보 참고)
  elasticsearch: '@elastic/mcp-server-elasticsearch 가 있지만 아직 카탈로그에 없음 (검증 필요)'
  fluentd: 전용 MCP 없음 → kubernetes MCP 로 파드 로그를 본다
  fluent-bit: 전용 MCP 없음 → kubernetes MCP 로 파드 로그를 본다
  kafka: 카탈로그에 없음 (검증 필요) → 지금은 kubernetes MCP 로 파드 로그를 본다
  redis: 카탈로그에 없음 → kubernetes MCP 로 파드 로그를 본다
  thanos: Prometheus 호환 API → prometheus 후보의 PROMETHEUS_URL 로 Thanos Query 주소를 쓴다
  victoriametrics: Prometheus 호환 API → prometheus 후보의 PROMETHEUS_URL 로 vmselect 주소를 쓴다

# ─── 분석 한계 → KOA 대응 ─────────────────────────────────────────
# KOA 는 클러스터를 바꾸지 않는다. 탐색에서 찾은 빈 곳은 "고칠 것"이 아니라 "분석할 때 감안할 한계"다.
# 여기에는 한계가 분석에 주는 영향과, 지금 쓸 수 있는 도구 안에서 KOA 가 어떻게 메우는지(workaround)만 적는다.
# 클러스터 설정 변경(지표 켜기, Ingress 열기, 설치 등)은 제안하지 않는다.
# priority 1 = 이 한계 때문에 결론을 확정하지 못할 수 있음 / 2 = 느려지거나 추정에 기댐 / 3 = 영향 작음
gap_advice:
  no-metrics:
    priority: 1
    title: 지표 없음
    impact: 장애 시작 시점과 추세를 숫자로 볼 수 없다
    workaround:
      - 시작 시점은 로그 저장소의 시간대별 오류 건수와 파드 재시작 시각으로 추정한다
      - 분석 보고서에 추세는 로그 기반 추정이라고 밝힌다
  no-logs:
    priority: 1
    title: 로그 저장소 없음
    impact: 재시작 전·삭제된 파드의 로그를 볼 수 없다
    workaround:
      - kubectl_logs(previous 포함)로 남아 있는 컨테이너 로그만 본다. 재시작이 두 번 이상이면 그 전 로그는 없다
      - 분석을 빨리 시작해야 한다고 알린다
  no-shipper:
    priority: 2
    title: 로그 수집기를 찾지 못함
    impact: 어떤 로그가 로그 저장소에 들어오는지 모른다
    workaround:
      - 로그 저장소의 인덱스 목록과 필드(app, pod, namespace 등)로 수집 범위를 거꾸로 파악한다
  shipper-health:
    priority: 1
    title: 로그 수집기 상태를 볼 지표 없음
    impact: 로그가 안 보일 때 트래픽이 없는 건지 수집이 끊긴 건지 바로 판정할 수 없다 (kind-lab 에서 실제로 겪음)
    workaround:
      - 수집기 파드 로그(kubectl_logs)에서 flush 실패·retry·연결 오류를 본다
      - 원본 파드 로그와 로그 저장소의 마지막 문서 시각을 비교한다. 원본에는 있는데 저장소에 없으면 수집 중단이다
      - 수집기 설정(ConfigMap)에서 일부러 버리는 로그(필터)를 확인한다
  short-event-ttl:
    priority: 1
    title: k8s 이벤트 보존 짧음
    impact: 보존 기간이 지나면 재시작·OOM·스케줄링 실패 이력이 사라진다
    workaround:
      - 분석 첫 단계에서 이벤트부터 읽는다
      - 사라진 이력은 파드 status(lastState.terminated 의 reason·exitCode·시각, restartCount)로 복원한다. 마지막 1회만 남는다
  event-ttl-unknown:
    priority: 2
    title: k8s 이벤트 보존 기간 미확인
    impact: 관리형 클러스터는 보통 1시간이라 사후 분석 때 이벤트가 없을 가능성이 높다
    workaround:
      - 분석 첫 단계에서 이벤트부터 읽는다
      - 사라진 이력은 파드 status(lastState.terminated, restartCount)로 복원한다
  no-gitops:
    priority: 3
    title: GitOps 없음
    impact: 무엇이 바뀌었나를 배포 이력으로 바로 볼 수 없다
    workaround:
      - ReplicaSet revision·생성 시각, 파드 시작 시각, 리소스 managedFields 의 시각으로 변경 시점을 복원한다
  no-metrics-api:
    priority: 3
    title: metrics API 없음
    impact: 지금 CPU·메모리 사용량(kubectl top)을 볼 수 없다
    workaround:
      - Prometheus 가 있으면 cAdvisor 지표(container_cpu_usage_seconds_total, container_memory_working_set_bytes)로 본다
      - 없으면 OOMKilled 기록과 requests·limits 설정으로 추정한다
  no-traces:
    priority: 3
    title: 트레이스 없음
    impact: 서비스 간 어느 구간에서 느려지는지 직접 볼 수 없다
    workaround:
      - 로그의 request_id 로 ingress → 앱 → 워커 로그를 이어 붙여 구간별 시간을 계산한다 (필드가 있을 때)
  no-alerting:
    priority: 2
    title: 경보 시스템 없음
    impact: 지금 울리는 경보로 문제 위치를 좁힐 수 없다
    workaround:
      - 파드 상태(재시작·NotReady·Pending)와 오류 로그 급증으로 문제 위치를 좁힌다
  no-access:
    priority: 2
    title: KOA 가 닿지 못하는 관측 시스템
