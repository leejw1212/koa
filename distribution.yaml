name: koa
version: 0.1.0
description: "KOA — Kubernetes 장애 분석 에이전트. 클러스터를 읽기 전용으로 탐색하고, 쓸 수 있는 관측 도구를 정리해, 사용자와 함께 읽기 전용 MCP 를 붙인다."
hermes_requires: ">=0.21.0"
author: "leejw1212"
license: "MIT"

# 설치·업데이트 때 이 경로만 프로필에 복사한다 (clusters/ 의 개발용 결과물은 싣지 않는다).
distribution_owned:
  - distribution.yaml
  - SOUL.md
  - config.yaml
  - skills/
  - koa/
  - k8s/
  - terminal/
  - docs/
  - README.md
# lab/ (kind-lab 토큰 발급 등 관리자 스크립트)과 clusters/ (개발용 결과)는 개발 체크아웃에만 둔다.

# 전부 선택. 클러스터마다 필요한 것이 달라서 koa/plan.py 가 탐색 결과를 보고 무엇을 채울지 알려 준다.
env_requires:
  - name: OPENSEARCH_URL
    description: "OpenSearch 주소 (opensearch MCP)"
    required: false
  - name: OPENSEARCH_USERNAME
    description: "OpenSearch 읽기 전용 계정"
    required: false
  - name: OPENSEARCH_PASSWORD
    description: "OpenSearch 읽기 전용 계정 비밀번호"
    required: false
  - name: PROMETHEUS_URL
    description: "Prometheus 주소 (prometheus MCP)"
    required: false
  - name: GRAFANA_URL
    description: "Grafana 주소 (grafana MCP)"
    required: false
  - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
    description: "Grafana Viewer 서비스 계정 토큰"
    required: false
  - name: ARGOCD_BASE_URL
    description: "Argo CD 주소 (argocd MCP)"
    required: false
  - name: ARGOCD_API_TOKEN
    description: "Argo CD role:readonly 계정 토큰"
    required: false
