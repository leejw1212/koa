model:
  provider: anthropic
  default: claude-opus-5-5
  base_url: https://api.anthropic.com
  api_mode: anthropic_messages
agent:
  max_turns: 150
  reasoning_effort: medium
# MCP 서버는 싣지 않는다. 클러스터마다 쓸 수 있는 도구가 달라서, 온보딩 때 koa/plan.py 가
# 탐색 결과를 보고 사용자와 정한 것만 등록한다 (정의는 koa/catalog.yaml).
mcp_servers: {}
terminal:
  shell_init_files:
    - ~/.profile
    - ~/.bash_profile
    - ~/.bashrc
    - ~/.hermes/profiles/koa/terminal/agent-env.sh   # 프로필 이름을 바꿔 설치했다면 이 경로도 바꾼다
