model:
  provider: anthropic
  default: claude-opus-5-5
  base_url: https://api.anthropic.com
  api_mode: anthropic_messages
agent:
  max_turns: 150
  reasoning_effort: medium
  service_tier: fast
browser:
  use_real_profile: true
onboarding:
  seen:
    profile_build_offered: true
mcp_servers:
  kubernetes:
    command: npx
    args:
      - -y
      - mcp-server-kubernetes@4.1.9
    env:
      ALLOW_ONLY_NON_DESTRUCTIVE_TOOLS: "true"
      KUBECONFIG_PATH: ${userHome}/.kube/hermes-readonly.yaml
    tools:
      include:
        - kubectl_get
        - kubectl_describe
        - kubectl_logs
        - explain_resource
      prompts: false
      resources: false
  opensearch:
    command: uvx
    args:
      - opensearch-mcp-server-py@0.11.0
    env:
      OPENSEARCH_URL: ${OPENSEARCH_URL}
      OPENSEARCH_SETTINGS_ALLOW_WRITE: "false"
      OPENSEARCH_USERNAME: ${OPENSEARCH_USERNAME}
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD}
    tools:
      include:
        - ListIndexTool
        - IndexMappingTool
        - SearchIndexTool
        - GetShardsTool
        - ClusterHealthTool
      prompts: false
      resources: false
  prometheus:
    command: uvx
    args:
      - prometheus-mcp-server@1.6.2
    env:
      PROMETHEUS_URL: ${PROMETHEUS_URL}
      PROMETHEUS_DISABLE_LINKS: "True"
    tools:
      include:
        - execute_query
        - execute_range_query
        - list_metrics
        - get_metric_metadata
        - get_targets
      prompts: false
      resources: false
  grafana:
    command: uvx
    args:
      - mcp-grafana@2.0.0
      - --disable-write
    env:
      GRAFANA_URL: ${GRAFANA_URL}
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN}
    tools:
      prompts: false
      resources: false
      include:
        - list_datasources
        - get_datasource
        - check_datasources_health
        - search_dashboards
        - get_dashboard_summary
        - get_dashboard_panel_queries
        - get_dashboard_property
        - query_prometheus
        - query_prometheus_histogram
        - list_prometheus_metric_names
        - list_prometheus_metric_metadata
        - list_prometheus_label_names
        - list_prometheus_label_values
        - query_loki_logs
        - query_loki_stats
        - query_loki_patterns
        - list_loki_label_names
        - list_loki_label_values
        - list_alert_groups
        - get_alert_group
        - alerting_rules_read
        - get_annotations
  argocd:
    command: uvx
    args:
      - --from
      - git+https://github.com/peopleforrester/mcp-k8s-observability-argocd-server@6ba6d1b0c9f4b715de1feda49e247d2ccd8378e8
      - argocd-mcp
    env:
      ARGOCD_URL: ${ARGOCD_BASE_URL}
      ARGOCD_TOKEN: ${ARGOCD_API_TOKEN}
      MCP_READ_ONLY: "true"
      MCP_DISABLE_DESTRUCTIVE: "true"
      MCP_MASK_SECRETS: "true"
    tools:
      include:
        - list_applications
        - get_application
        - get_application_status
        - get_application_diff
        - get_application_history
        - diagnose_sync_failure
        - get_application_logs
        - list_clusters
        - list_projects
      prompts: false
      resources: false
terminal:
  shell_init_files:
    - ~/.profile
    - ~/.bash_profile
    - ~/.bashrc
    - ~/hermes-config/terminal/agent-env.sh
