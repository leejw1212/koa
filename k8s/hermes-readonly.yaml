# Hermes kubernetes MCP 용 읽기 전용 계정.
# 권한: 내장 ClusterRole `view` (Secret 제외 네임스페이스 리소스 조회) + 노드 등 클러스터 리소스 조회.
# 쓰기 동사(create/update/patch/delete)와 exec/port-forward, Secret 조회는 API 서버에서 거부된다.
apiVersion: v1
kind: Namespace
metadata:
  name: hermes
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-readonly
  namespace: hermes
---
# 만료 없는 SA 토큰 (lab 용). 폐기하려면 이 Secret 을 지우면 토큰이 즉시 무효가 된다.
apiVersion: v1
kind: Secret
metadata:
  name: hermes-readonly-token
  namespace: hermes
  annotations:
    kubernetes.io/service-account.name: hermes-readonly
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-readonly-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: hermes-readonly
    namespace: hermes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-readonly-cluster
rules:
  - apiGroups: [""]
    resources: [nodes, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  # Gateway API 라우팅 계층 조회 (HTTPRoute 로 라우팅하는 클러스터용). discover 가
  # httproutes.gateway.networking.k8s.io 를 --all-namespaces 로 list 한다. 조회만 허용.
  - apiGroups: [gateway.networking.k8s.io]
    resources:
      - gateways
      - gatewayclasses
      - httproutes
      - grpcroutes
      - tcproutes
      - udproutes
      - tlsroutes
      - referencegrants
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-readonly-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-readonly-cluster
subjects:
  - kind: ServiceAccount
    name: hermes-readonly
    namespace: hermes
