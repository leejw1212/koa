# Read-only ServiceAccount for agent cluster access.
# Built-in `view` (namespaced reads, no Secrets/exec) + cluster-scoped reads.
apiVersion: v1
kind: Namespace
metadata: {name: hermes}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: hermes-readonly, namespace: hermes}
---
# Non-expiring token. Revoke by deleting this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: hermes-readonly-token
  namespace: hermes
  annotations: {kubernetes.io/service-account.name: hermes-readonly}
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: hermes-readonly-view}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects: [{kind: ServiceAccount, name: hermes-readonly, namespace: hermes}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: hermes-readonly-cluster}
rules:
  - {apiGroups: [""], resources: [nodes, persistentvolumes], verbs: [get, list, watch]}
  - {apiGroups: [storage.k8s.io], resources: [storageclasses], verbs: [get, list, watch]}
  - {apiGroups: [metrics.k8s.io], resources: [nodes, pods], verbs: [get, list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: hermes-readonly-cluster}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: hermes-readonly-cluster}
subjects: [{kind: ServiceAccount, name: hermes-readonly, namespace: hermes}]
